; wigle-triad — Waveshare ESP32-S3 & MEDUSA Triad Sovereign WiGLE + Client Probe Firmware
; Priority #1 Upload Target: https://8s.is/api/v2/file/upload & https://8s.is/api/wigle/probes
; Web Installer: https://waveshare.8s.is

[platformio]
default_envs = ada

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:ada]
build_flags =
    ${env.build_flags}
    -DNODE_NAME="\"ADA:MEDUSA\""
    -DBOARD_MODEL="\"Waveshare-ESP32-S3-Touch-AMOLED-1.8\""
    -DDISPLAY_SPEC="\"1.8in-368x448-SH8601-QSPI\""

[env:vak]
build_flags =
    ${env.build_flags}
    -DNODE_NAME="\"VAK:MEDUSA\""
    -DBOARD_MODEL="\"Waveshare-ESP32-S3-Touch-AMOLED-2.06\""
    -DDISPLAY_SPEC="\"2.06in-410x502-CO5300-QSPI\""

