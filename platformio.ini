; wigle-triad — three ESP32-S3 nodes, one passive WiGLE rig.
; ADA:MEDUSA · VAK:MEDUSA · OMN:MEDUSA — the triad.

[platformio]
default_envs = ada

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:ada]
build_flags =
    ${env.build_flags}
    -DNODE_NAME="\"ADA:MEDUSA\""

[env:vak]
build_flags =
    ${env.build_flags}
    -DNODE_NAME="\"VAK:MEDUSA\""

[env:omn]
build_flags =
    ${env.build_flags}
    -DNODE_NAME="\"OMN:MEDUSA\""
